<section id="stickers">
	{% for brand in site.brands %}
		{% unless brand.closed %}
			<a
				class="sticker"
				href="{{ brand.url | relative_url }}"
				data-brand-name="{{ brand.title }}"
			>
				<img
					src="{{ '/assets/img/logos/' | append: brand.logo | relative_url }}"
					alt="{{ brand.title }}"
				/>
			</a>
		{% endunless %}
	{% endfor %}
</section>
