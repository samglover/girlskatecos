<section id="stickers">
	{% for brand in site.brands %}
		{% unless brand.closed %}
			<a
				class="sticker"
				href="{{ brand.url | relative_url }}"
				data-brand-name="{{ brand.title }}"
			>
				<img
					{% if brand.logo_src %}
						src="{{ brand.logo_src | relative_url }}"
						srcset="{{ brand.logo_srcset }}"
						sizes="210px"
						width="{{ brand.logo_width }}"
						height="{{ brand.logo_height }}"
					{% else %}
						src="{{ '/assets/img/logos/' | append: brand.logo | relative_url }}"
					{% endif %}
					alt="{{ brand.title }}"
				/>
			</a>
		{% endunless %}
	{% endfor %}
</section>
